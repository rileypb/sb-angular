

@if (project) {
  <app-project-frame [project]="project">
    @if (project.currentSprint) {
      <sb-sprint-execution-inner [sprint]="project.currentSprint"></sb-sprint-execution-inner>
    } @else {
      <span class="base-text">No Current Sprint</span>
    }
  </app-project-frame>
} @else {
  <mat-spinner></mat-spinner>
}
