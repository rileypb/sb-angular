@if (epic) {
  <div>
    <form class="epic-form menu-text" [formGroup]="epicForm" (ngSubmit)="submit()">
      <div class="row">
        <mat-form-field class="col-12" appearance="fill">
          <mat-label>Epic Title</mat-label>
          <input matInput class="user-text" formControlName="title">
          <mat-error>Title can't be blank</mat-error>
        </mat-form-field>
      </div>
      <div class="row">
        <div class="col-12">
          <label class="menu-text">Description</label>
          <quill-editor formControlName="description"
                        [style]="{'height': '200px'}"
                        [modules]="quillModules"
                        format="object"
                        placeholder="Enter epic description...">
          </quill-editor>
        </div>
      </div>
      <div class="row">
        <mat-form-field class="col-6 base-text" appearance="fill">
          <mat-label>Size</mat-label>
          <mat-select  class="user-text" formControlName="size" matInput>
            <mat-option class="user-text" value=4>XL</mat-option>
            <mat-option class="user-text" value=3>L</mat-option>
            <mat-option class="user-text" value=2>M</mat-option>
            <mat-option class="user-text" value=1>S</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-label style="margin-right: 4px;">Color</mat-label>
        <sb-color-picker class="menu-text" formControlName="color" matInput></sb-color-picker>
      </div>
      <div mat-dialog-actions class="mb-2">
        @if (mode == 'edit' && permission(epic.project, 'delete-epic')) {
          <button mat-button type="button" class="delete-button mr-2" (click)="confirmDelete()"><mat-icon>delete</mat-icon>Delete</button>
        }
        <button mat-button type="button" class="cancel-button mr-2" (click)="cancelEdit.emit()"><mat-icon>close</mat-icon>Cancel</button>
        <button mat-button type="submit" class="save-button" [disabled]="!epicForm.valid"><mat-icon>save</mat-icon>Save</button>
      </div>
    </form>
  </div>
}
